[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-booster"
version = "0.1.0"
description = "Copilota scettico per la ricerca scientifica: grafo della ricerca, ipotesi falsificabili, anomalie nei dati."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "python-multipart>=0.0.9",
    "uvicorn>=0.29",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "h5py>=3.10",
    "pint>=0.23",
    "pypdf>=4.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "reportlab>=4"]
postgres = ["psycopg[binary]>=3.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
