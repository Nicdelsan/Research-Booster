name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-sqlite:
    name: Test (SQLite, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  test-postgres:
    name: Test (PostgreSQL 16 + pgvector)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rb
          POSTGRES_PASSWORD: rb
          POSTGRES_DB: rb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RB_TEST_DATABASE_URL: postgresql+psycopg://rb:rb@localhost:5432/rb_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Migrazioni da riga di comando e controllo di deriva
        env:
          RB_DATABASE_URL: ${{ env.RB_TEST_DATABASE_URL }}
        run: |
          alembic upgrade head
          alembic check
      - run: python -m pytest -q
