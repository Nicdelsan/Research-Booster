# Configurazione Alembic per l'uso da riga di comando.
# L'URL del database si legge da RB_DATABASE_URL (vedi src/rb/migrations/env.py).
#
#   alembic upgrade head                              porta lo schema all'ultima versione
#   alembic revision --autogenerate -m "descrizione"  crea una nuova migrazione dai modelli
#   alembic check                                     verifica che modelli e migrazioni coincidano

[alembic]
script_location = rb:migrations
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
